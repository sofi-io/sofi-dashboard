services:
  postgres:
    image: postgres:16-alpine
    container_name: sofi-dashboard-postgres
    environment:
      POSTGRES_DB: sofi_dashboard
      POSTGRES_USER: sofi
      POSTGRES_PASSWORD: sofi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofi -d sofi_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  sofi_documents: